[package]
name = "ragrig-bin"
version = "0.5.0"
edition = "2024"
description = "REPL binary for the Ragrig RAG framework — paper search, chat, and document indexing."
license = "MIT"
repository = "https://github.com/schmettow/ragrig"

[features]
default = []
internal-embed = ["ragrig/internal-embed"]
kreuzberg = ["ragrig/kreuzberg"]

[dependencies]
#ragrig = { path = "../ragrig" }
ragrig = { version = "0.9.6" }

# ── CLI / REPL ──────────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }
rustyline = "18.0"

# ── Async runtime ───────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Logging / tracing ───────────────────────────────────────────────────
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── Networking / API ────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2"

# ── Error handling ──────────────────────────────────────────────────────
anyhow = "1.0"
