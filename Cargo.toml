[package]
name = "ragrig-cli"
version = "1.1.0"
edition = "2024"
rust-version = "1.89"
description = "REPL binary for the Ragrig RAG framework — paper search, chat, and document indexing."
license = "MIT"
repository = "https://github.com/schmettow/ragrig-cli"
readme = "README.md"
keywords = ["rag", "llm", "repl", "ollama"]
categories = ["command-line-utilities", "science"]

[features]
default = ["internal", "ollama-embed", "test-fixtures"]
internal = ["ragrig/internal"]
ollama-embed = ["ragrig/ollama-embed"]
internal-embed = ["ragrig/internal-embed"]
internal-generate = ["ragrig/internal-generate"]
internal-generate-cuda = ["ragrig/internal-generate-cuda"]
internal-generate-metal = ["ragrig/internal-generate-metal"]
internal-generate-mkl = ["ragrig/internal-generate-mkl"]
offline = ["ragrig/offline"]
offline-cuda = ["ragrig/offline-cuda"]
offline-metal = ["ragrig/offline-metal"]
offline-mkl = ["ragrig/offline-mkl"]
lancedb = ["ragrig/lancedb"]
test-fixtures = ["ragrig/test-fixtures"]
kreuzberg = ["ragrig/kreuzberg"]
vision-pdf = ["ragrig/vision-pdf"]
chunker-textsplitter = ["ragrig/chunker-textsplitter"]
chunker-cognigraph = ["ragrig/chunker-cognigraph"]
# `all` must enable the CLI-local features too: `internal-embed`,
# `kreuzberg`, and `vision-pdf` gate match arms in main.rs, and
# `ragrig/all` alone does not set the CLI's own feature flags.
all = [
    "ragrig/all",
    "internal-embed",
    "kreuzberg",
    "vision-pdf",
    "chunker-textsplitter",
    "chunker-cognigraph",
]

[dependencies]
# Dev branch — profile management fixes (MemoryConfig.strategy,
# portable save_to_profile/load_from_profile).
ragrig = { path = "../ragrig" }

# ── CLI / REPL ──────────────────────────────────────────────────────
clap = { version = "4", features = ["derive", "env"] }
rustyline = "18.0"
# Cross-platform terminal control: raw mode plus low-level key events
# for the ESC-cancel watcher (replaces the Unix-only nix termios code).
crossterm = "0.29"
# Progress bar for indexing — auto-hides when stderr is not a TTY.
indicatif = "0.18"

# ── Async runtime ───────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Logging / tracing ───────────────────────────────────────────────────
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# ── Networking / API ────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
urlencoding = "2"

# ── Error handling ──────────────────────────────────────────────────────
anyhow = "1.0"

[target.'cfg(unix)'.dependencies]
# Unix-only "cbreak" terminal setup for the ESC-cancel watcher.  crossterm's
# enable_raw_mode disables output post-processing (OPOST), which would stop
# `\n` from mapping to `\r\n` and mangle streamed output; rustix lets us
# clear just ICANON|ECHO instead.
rustix = { version = "1.1", features = ["termios"] }
